<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lead Score Tool — Waitlist</title>
</head>

<body>

  <h1>Want early access?</h1>

  <p>
    Enter your email and we'll let you know when
    Lead Score Tool is ready.
  </p>

  <form id="waitlist-form">

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >

    <label>
      <input type="checkbox" id="consent" required>
      I agree to the processing of my email for early access.
    </label>

    <button type="submit">
      Join waitlist
    </button>

  </form>

  <p id="message"></p>


<script>

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbw6cooQ2hkCsK2gS-vzh7PceeA5_uLTr38cV3yxG6RR28SBPILYl-0vzWCWOVHUOslQAg/exec';


document
  .getElementById('waitlist-form')
  .addEventListener('submit', async function(event) {

    event.preventDefault();

    const email =
      document.getElementById('email').value.trim();

    const language =
      navigator.language || '';

    const timezone =
      Intl.DateTimeFormat().resolvedOptions().timeZone || '';

    const source =
      new URLSearchParams(window.location.search)
        .get('utm_source') || '';

    const data = {
      email: email,
      language: language,
      timezone: timezone,
      source: source
    };

    const message =
      document.getElementById('message');

    message.textContent = 'Joining...';

    try {

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      });

      message.textContent =
        "You're on the list! We'll be in touch.";

      document
        .getElementById('waitlist-form')
        .reset();

    } catch (error) {

      console.error(error);

      message.textContent =
        'Something went wrong. Please try again.';
    }

});

</script>

</body>
</html>
